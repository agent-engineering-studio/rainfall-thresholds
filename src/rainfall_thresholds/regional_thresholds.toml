# Published regional rainfall thresholds for landslide triggering in Italy.
#
# Data with their sources, not the thresholds this package fits: those are
# `rainfall_thresholds.ITALICA_T5`. Moved here from Limen (limen#506), survey
# of 2026-11-12. An entry is here only with published numeric parameters and a
# licence that allows transcribing them. The thresholds of Emilia-Romagna
# (SIGMA), Piemonte (SLOPS/DEFENSE), Sardegna, Veneto, Puglia, Lazio and the
# other regions are not here: either not published in numbers, or with no
# declared licence.
#
# `form`:
#   E-D  E = alpha * D^gamma, event cumulated rainfall E in mm, duration D in
#        hours (CNR-IRPI). As an intensity, I = alpha * D^(gamma - 1).
#   I-D  I = alpha * D^(-beta), intensity I in mm/h.
# `regions`: the Italian regions (e-ITALICA spelling) the threshold covers
# whole. A threshold for an alert zone or a physiographic area has `zone` and
# no `regions`: applying it needs the geometry of the zone, which is not here.
# `duration_hours`: the range of durations it was fitted on.
# `no_rain_gap_hours`: the dry hours that close an event, where published.

[sources.vennari2014]
citation = "Vennari C. et al. (2014), Rainfall thresholds for shallow landslide occurrence in Calabria, southern Italy, NHESS 14, 317-330"
url = "https://nhess.copernicus.org/articles/14/317/2014/nhess-14-317-2014.pdf"
license = "CC BY 3.0"

[sources.peruccacci2017]
citation = "Peruccacci S. et al. (2017), Rainfall thresholds for possible landslide occurrence in Italy, Geomorphology 290, 39-57"
url = "https://geomorphology.irpi.cnr.it/publications/repository/public/journals/2017/peruccacci-et-al-2017.pdf"
license = "CC BY 4.0"

[sources.segoni2015]
citation = "Segoni S. et al. (2015), NHESS 15, 853-861, Tab. 1 (soglie per le zone di allerta della Toscana)"
url = "https://nhess.copernicus.org/articles/15/853/2015/nhess-15-853-2015.pdf"
license = "CC BY 3.0"

[sources.nocentini2024]
citation = "Nocentini N. et al. (2024), Landslides, Tab. 1-2 (soglie per le zone di allerta della Liguria)"
url = "https://flore.unifi.it/retrieve/b8259e7f-849b-4f9a-9b15-8b4cbc56e38f/Nocentini%20et%20al%20LANDSLIDES%202024%20%282%29.pdf"
license = "CC BY 4.0"

[[thresholds]]
id = "calabria-t5"
regions = ["Calabria"]
form = "E-D"
alpha = 8.6
gamma = 0.41
duration_hours = [1.0, 451.0]
level = "T5"
source = "vennari2014"
note = "Tab. 2, T5,C; incertezze Δα 1,1, Δγ 0,03"

