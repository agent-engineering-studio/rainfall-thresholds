site_name: rainfall-thresholds
site_description: "Rainfall intensity-duration thresholds for shallow landslides (Caine power law, frequentist fitting)"
site_url: https://agentengineering.it/rainfall-thresholds/
repo_url: https://github.com/agent-engineering-studio/rainfall-thresholds
repo_name: agent-engineering-studio/rainfall-thresholds
edit_uri: edit/main/docs/
copyright: "Code Apache-2.0. Italian thresholds fitted on e-ITALICA v4 (Brunetti et al. 2024, doi:10.5281/zenodo.14204473)."

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle: {icon: material/weather-night, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle: {icon: material/weather-sunny, name: Light mode}

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_root_heading: true
            show_source: false
            members_order: source
            separate_signature: true
            show_signature_annotations: true
            filters: ["!^_"]

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc: {permalink: true}
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.snippets: {base_path: ["."], check_paths: true}
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

exclude_docs: |
  make_figures.py

nav:
  - Home: index.md
  - API reference:
      - Threshold: api/threshold.md
      - Rainfall events: api/events.md
      - Fitting: api/fit.md
      - Italy (T5 thresholds): api/italy.md
  - Changelog: changelog.md
  - Contributing: contributing.md

validation:
  links:
    not_found: info
    unrecognized_links: info
