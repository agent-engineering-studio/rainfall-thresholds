[project]
name = "rainfall-thresholds"
version = "0.3.0"
description = "Rainfall intensity-duration thresholds for shallow landslides (Caine power law, frequentist fitting)"
readme = "README.md"
keywords = ["landslide", "rainfall threshold", "intensity-duration", "caine", "hydrology", "natural hazards", "italy", "italica"]
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Giuseppe Zileni", email = "giuseppe.zileni@gmail.com" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Topic :: Scientific/Engineering :: Hydrology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
# The MCP server (rainfall-thresholds-mcp). The package itself needs nothing.
mcp = ["mcp>=2.3"]

[project.scripts]
rainfall-thresholds-mcp = "rainfall_thresholds.mcp_server:run"

[project.urls]
Homepage = "https://github.com/agent-engineering-studio/rainfall-thresholds"
Issues = "https://github.com/agent-engineering-studio/rainfall-thresholds/issues"
Changelog = "https://github.com/agent-engineering-studio/rainfall-thresholds/blob/main/CHANGELOG.md"

[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mcp>=2.3",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

examples = [
    "jupyterlab>=4.2",
    "nbconvert>=7.16",
    "matplotlib>=3.9",
    # Only for notebooks/04: the sister libraries, joined in a notebook as Limen
    # joins them. The package itself never imports them (tests/test_package.py).
    "dpc-radar~=0.3.0",
    "ispra-idrogeo~=0.10.0",
]

docs = [
    "zensical>=0.1.0",
    "mkdocstrings-python>=1.18",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "ARG", "PTH", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG", "B018"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests", "benchmarks"]
warn_unused_ignores = true
warn_redundant_casts = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["rainfall_thresholds"]

[tool.coverage.report]
fail_under = 90
show_missing = true
